<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Studio Aing</title><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@500;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#fcfcf9;color:#1a1a1a;height:100vh;display:flex;flex-direction:column}header{height:52px;background:#fff;border-bottom:1px solid #e5e5e0;display:flex;align-items:center;justify-content:space-between;padding:0 12px} .logo{font-weight:800;font-size:16px} .logo span{color:#2563eb}.m-switch{display:flex;background:#f1f1ec;border-radius:20px;padding:3px;gap:2px}.m-btn{padding:6px 14px;border-radius:16px;border:0;font-size:12px;font-weight:700;cursor:pointer;background:transparent;color:#666}.m-btn.active{background:#1a1a1a;color:#fff}.btn-run{background:#2563eb;color:#fff;border:0;padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer}.main{flex:1;display:flex;overflow:hidden;position:relative}.editor-wrap{flex:1;display:flex;flex-direction:column;background:#fff;min-width:0}.tabs{height:36px;background:#f8f8f5;border-bottom:1px solid #e5e5e0;display:flex;align-items:center;padding:0 10px;font-size:12px;font-family:JetBrains Mono,monospace}.code-area{flex:1;overflow:auto;background:#fff}#code{width:100%;min-height:100%;border:0;outline:0;padding:14px;font-family:JetBrains Mono,monospace;font-size:12px;line-height:1.6;white-space:pre;overflow-wrap:normal;overflow-x:auto;display:block}.preview{width:360px;background:#fafaf7;border-left:1px solid #e5e5e0;display:flex;flex-direction:column}.preview-h{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11px;font-weight:600;color:#666;border-bottom:1px solid #e5e5e0}.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block}.phone-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;background-image:radial-gradient(#ddd 1px, transparent 1px);background-size:18px 18px}.phone{width:260px;height:500px;background:#fff;border-radius:28px;border:7px solid #111;box-shadow:0 18px 36px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column;position:relative}.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:84px;height:18px;background:#111;border-radius:0 0 10px 10px}.app-bar{background:#2563eb;color:#fff;padding:36px 12px 10px;text-align:center;font-weight:700;font-size:13px}.app-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}.counter{font-size:44px;font-weight:800}.fab{width:52px;height:52px;background:#2563eb;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 10px rgba(37,99,235,.4)}@media(max-width:768px){.preview{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;z-index:5;display:none;border:0}.preview.show{display:flex}.editor-wrap.hide{display:none}}</style></head><body><header><div class="logo">⚡ Studio <span>Aing</span></div><div class="m-switch"><button class="m-btn active" id="btn-code" onclick="showTab('code')">CODE</button><button class="m-btn" id="btn-preview" onclick="showTab('preview')">PREVIEW</button></div><button class="btn-run" onclick="run()">▶ Run</button></header><div class="main"><div class="editor-wrap" id="editorWrap"><div class="tabs">📘 lib/main.dart</div><div class="code-area"><textarea id="code" spellcheck="false">import 'package:flutter/material.dart';

void main() { runApp(const MyApp()); }

class MyApp extends StatelessWidget {
  const MyApp({super.key});
  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'Studio Aing',
      theme: ThemeData(
        colorScheme: ColorScheme.fromSeed(seedColor: Colors.blue),
        useMaterial3: true,
      ),
      home: const CounterPage(),
    );
  }
}

class CounterPage extends StatefulWidget {
  const CounterPage({super.key});
  @override
  State<CounterPage> createState() => _CounterPageState();
}

class _CounterPageState extends State<CounterPage> {
  int _counter = 0;
  void _increment() { setState(() { _counter++; }); }
  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('Studio Aing')),
      body: Center(child: Column(
        mainAxisAlignment: MainAxisAlignment.center,
        children: [
          const Text('You pushed the button:'),
          Text('$_counter', style: Theme.of(context).textTheme.headlineMedium),
        ],
      )),
      floatingActionButton: FloatingActionButton(onPressed: _increment, child: const Icon(Icons.add)),
    );
  }
}
</textarea></div></div><div class="preview" id="preview"><div class="preview-h"><span><span class="dot"></span> Emulator • Pixel 7</span><span>Hot Reload ✓</span></div><div class="phone-wrap"><div class="phone"><div class="notch"></div><div class="app-bar">Studio Aing</div><div class="app-body"><div style="color:#666;font-size:12px">You have pushed the button:</div><div class="counter" id="counter">0</div><div style="color:#999;font-size:10px">lib/main.dart • Ready</div><div class="fab" onclick="inc()">+</div></div></div></div></div></div><script>let c=0;function inc(){c++;document.getElementById('counter').innerText=c;if(navigator.vibrate)navigator.vibrate(15)}function run(){inc();let b=document.querySelector('.btn-run');let t=b.innerText;b.innerText='✓';setTimeout(()=>b.innerText=t,700)}function showTab(t){const ed=document.getElementById('editorWrap');const pr=document.getElementById('preview');const bc=document.getElementById('btn-code');const bp=document.getElementById('btn-preview');if(t==='preview'){ed.classList.add('hide');pr.classList.add('show');bp.classList.add('active');bc.classList.remove('active')}else{ed.classList.remove('hide');pr.classList.remove('show');bc.classList.add('active');bp.classList.remove('active')}}</script></body></html>
